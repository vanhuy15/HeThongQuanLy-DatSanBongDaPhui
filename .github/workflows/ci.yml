name: CI Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: quanlysanbong
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: ""
      DB_NAME: quanlysanbong
      SEED_ADMIN_PASS: "123456"
      SEED_TEST_PASS: "123456"
      BASE_URL: "http://127.0.0.1:8000"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, mysqli, pdo, curl, openssl

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install NPM Dependencies
      run: npm install

    - name: Copy .env file & populate seed passwords
      run: |
        cp .env.example .env
        echo "SEED_ADMIN_PASS=123456" >> .env
        echo "SEED_TEST_PASS=123456" >> .env

    - name: Run Database Migrations
      run: node scripts/run-php.js database/migrate.php

    - name: Run Database Seeder
      run: node scripts/run-php.js database/seed.php

    - name: Run Unit Tests (PHPUnit)
      run: npm run test:unit

    - name: Start Built-in Web Server
      run: php -S 127.0.0.1:8000 > /dev/null 2>&1 &

    - name: Run API Tests (Newman / Postman)
      run: |
        npx --yes newman run tester/02_api_test/QuanLySanBong_API.postman_collection.json \
          -e tester/02_api_test/QuanLySanBong.postman_environment.json \
          --env-var "baseUrl=http://127.0.0.1:8000" || true

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run E2E UI Tests (Playwright)
      run: npm run test:e2e || true
